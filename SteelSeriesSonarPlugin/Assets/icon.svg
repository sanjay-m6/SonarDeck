<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Background circle - SteelSeries orange-red gradient -->
  <defs>
    <radialGradient id="bgGrad" cx="40%" cy="35%" r="65%">
      <stop offset="0%"   stop-color="#ff6b35"/>
      <stop offset="100%" stop-color="#c0392b"/>
    </radialGradient>
    <radialGradient id="gloss" cx="50%" cy="20%" r="60%">
      <stop offset="0%"   stop-color="rgba(255,255,255,0.28)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
  </defs>

  <!-- Outer circle -->
  <circle cx="50" cy="50" r="48" fill="url(#bgGrad)"/>
  <!-- Gloss overlay -->
  <circle cx="50" cy="50" r="48" fill="url(#gloss)"/>

  <!-- Speaker / waveform icon (white) -->
  <!-- Speaker cone -->
  <polygon points="22,38 34,38 46,26 46,74 34,62 22,62"
           fill="white" opacity="0.95"/>
  <!-- Speaker grille rectangle -->
  <rect x="22" y="38" width="12" height="24" rx="1"
        fill="white" opacity="0.95"/>

  <!-- Sound waves -->
  <path d="M52,38 Q62,50 52,62"
        fill="none" stroke="white" stroke-width="4"
        stroke-linecap="round" opacity="0.95"/>
  <path d="M57,31 Q72,50 57,69"
        fill="none" stroke="white" stroke-width="4"
        stroke-linecap="round" opacity="0.80"/>
  <path d="M63,24 Q82,50 63,76"
        fill="none" stroke="white" stroke-width="3.5"
        stroke-linecap="round" opacity="0.55"/>

  <!-- Small "S" badge bottom-right for SteelSeries branding -->
  <circle cx="76" cy="76" r="13" fill="#1a1a2e" opacity="0.85"/>
  <text x="76" y="81" text-anchor="middle"
        font-family="'Arial Black', Arial, sans-serif"
        font-weight="900" font-size="14" fill="white">S</text>
</svg>
